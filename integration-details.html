    <script>
      (function () {
        var segments = [
          { text: 'Choose your ' },
          { text: 'Mission', color: '#4475f5' }
        ];
        var full = segments.map(function (s) { return s.text; }).join('');
        var el = document.getElementById('missionTitle');
        var cursor = el.nextElementSibling;
        var idx = 0;
        var started = false;

        function tick() {
          var remaining = idx;
          var html = '';
          segments.forEach(function (s) {
            var chunk = s.text.slice(0, Math.max(0, Math.min(s.text.length, remaining)));
            remaining -= s.text.length;
            if (!chunk) return;
            html += s.color ? '<span style="color:' + s.color + '">' + chunk + '</span>' : chunk;
          });
          el.innerHTML = html;
          if (idx < full.length) {
            idx++;
            setTimeout(tick, 38);
          } else {
            setTimeout(function () {
              cursor.style.animation = 'none';
              cursor.style.opacity = '0';
            }, 900);
          }
        }

        var obs = new IntersectionObserver(function (entries) {
          if (entries[0].isIntersecting && !started) {
            started = true;
            obs.disconnect();
            setTimeout(tick, 400);
          }
        }, { threshold: 0.15 });

        obs.observe(document.querySelector('.page-hero h1'));
      })();

      (function () {
        var track = document.getElementById('missionTrack');
        var nextArrow = document.getElementById('missionArrow');
        var prevArrow = document.getElementById('missionArrowBack');
        if (!track || !nextArrow || !prevArrow) return;
        var total = track.querySelectorAll('.mission-page').length;
        var current = 0;

        function update() {
          track.style.transform = 'translateX(-' + (current * 100) + '%)';
        }

        nextArrow.addEventListener('click', function () {
          current = (current + 1) % total;
          update();
        });

        prevArrow.addEventListener('click', function () {
          current = (current - 1 + total) % total;
          update();
        });
      })();

      (function () {
        var tiles = document.querySelectorAll('.mission-tile');
        var titleEl = document.getElementById('modulesTitle');
        var textEl = document.getElementById('modulesTitleText');
        var cursor = textEl.nextElementSibling;
        if (!tiles.length || !titleEl) return;
        var generation = 0;

        function tick(segments, idx, gen) {
          if (gen !== generation) return;
          var full = segments.map(function (s) { return s.text; }).join('');
          var remaining = idx;
          var html = '';
          segments.forEach(function (s) {
            var chunk = s.text.slice(0, Math.max(0, Math.min(s.text.length, remaining)));
            remaining -= s.text.length;
            if (!chunk) return;
            html += s.color ? '<span style="color:' + s.color + '">' + chunk + '</span>' : chunk;
          });
          textEl.innerHTML = html;
          if (idx < full.length) {
            setTimeout(function () { tick(segments, idx + 1, gen); }, 38);
          } else {
            setTimeout(function () {
              if (gen !== generation) return;
              cursor.style.animation = 'none';
              cursor.style.opacity = '0';
            }, 900);
          }
        }

        tiles.forEach(function (tile) {
          tile.addEventListener('click', function () {
            var nameEl = tile.querySelector('.mission-tile-title');
            var missionName = nameEl ? nameEl.textContent.trim() : '';
            var segments = [
              { text: 'Select relevant AI modules for ' },
              { text: missionName, color: '#4475f5' }
            ];

            generation++;
            cursor.style.animation = '';
            cursor.style.opacity = '';
            titleEl.classList.add('is-visible');
            tick(segments, 0, generation);
          });
        });
      })();
    </script>
