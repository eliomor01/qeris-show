<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QERIS | Contact</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="ai-pilot.html" aria-label="QERIS home">
        <img src="assets/qeris-logo.png" alt="QERIS" />
      </a>
      <nav class="site-nav" aria-label="Primary navigation">
        <a href="ai-pilot.html">AI Pilot</a>
        <a href="team.html">Team</a>
        <a class="active" href="contact.html">Contact</a>
      </nav>
    </header>

    <main class="page-shell">
      <section class="page-hero">
      </section>

      <section class="contact-layout contact-form-only">
        <div class="contact-card">
          <a class="contact-close" href="ai-pilot.html" aria-label="Close">&times;</a>
          <h1 class="contact-title">Contact us</h1>
          <form class="contact-form">
            <label>
              <span>Full name<span class="contact-required">*</span></span>
              <input type="text" name="name" autocomplete="name" required />
            </label>
            <label>
              <span>Company<span class="contact-required">*</span></span>
              <input type="text" name="company" autocomplete="organization" required />
            </label>
            <label>
              <span>Phone</span>
              <input type="tel" name="phone" autocomplete="tel" />
            </label>
            <label>
              <span>Email<span class="contact-required">*</span></span>
              <input type="email" name="email" autocomplete="email" required />
            </label>
            <label>
              <span>Message</span>
              <textarea name="message" rows="5"></textarea>
            </label>
            <button type="submit">Submit</button>
          </form>
        </div>
      </section>
    </main>
    <script>
      (function () {
        var demo = new URLSearchParams(window.location.search).get('demo');
        if (!demo) return;
        var textarea = document.querySelector('.contact-form textarea[name="message"]');
        if (textarea) textarea.value = 'Requesting a demo of: ' + demo;
      })();
    </script>
    <script src="chrome.js"></script>
  </body>
</html>
